:root{
  --bg:        #0B0E12;
  --panel:     #0F141C;
  --surface:   #181E26;
  --surface-2: #222B34;

  --tx:        #F1F7FC;
  --tx-body:   #B5C5D4;
  --tx-mute:   #8FA3B5;

  --amber:     #D9942F;   --amber-rgb: 217,148,47;
  --steel:     #3F6E96;   --steel-rgb: 63,110,150;
  --notif:     #FF9C00;   --notif-rgb: 255,156,0;
  --matter:    #17B98F;   --matter-rgb: 23,185,143;
  --deny:      #FF4046;   --deny-rgb: 255,64,70;
  --slate-rgb: 143,163,181;

  --line: rgba(var(--steel-rgb), 0.34);
  --hair: rgba(var(--steel-rgb), 0.18);
}

*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }

body{
  background:
    radial-gradient(1200px 600px at 18% -10%, rgba(var(--steel-rgb),0.10), transparent 60%),
    radial-gradient(900px 500px at 92% 0%, rgba(var(--amber-rgb),0.06), transparent 62%),
    var(--bg);
  background-attachment: fixed;
  color: var(--tx-body);
  font-family:'BlenderPro','Rajdhani','Saira Condensed',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:400; font-size:12px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---------- cadre fait main : 4 filets + 8 crochets d'angle ---------- */
.frame{
  position:relative;
  background: rgba(15,20,28,0.90);
  border:1px solid var(--line);
  background-image:
    linear-gradient(var(--amber),var(--amber)), linear-gradient(var(--amber),var(--amber)),
    linear-gradient(var(--amber),var(--amber)), linear-gradient(var(--amber),var(--amber)),
    linear-gradient(var(--amber),var(--amber)), linear-gradient(var(--amber),var(--amber)),
    linear-gradient(var(--amber),var(--amber)), linear-gradient(var(--amber),var(--amber));
  background-repeat:no-repeat;
  background-size: 13px 2px, 2px 13px, 13px 2px, 2px 13px,
                   13px 2px, 2px 13px, 13px 2px, 2px 13px;
  background-position:
    left top, left top, right top, right top,
    left bottom, left bottom, right bottom, right bottom;
}

/* ---------- barre de section (motif signature) ---------- */
.bar{
  --acc-rgb: var(--amber-rgb);
  display:flex; align-items:center; gap:8px;
  background: rgba(var(--acc-rgb), 0.14);
  padding:3px 8px; width:100%;
}
.bar .ico{
  width:16px; height:16px; flex:none;
  background: rgb(var(--acc-rgb));
  clip-path: polygon(28% 0,100% 0,100% 72%,72% 100%,0 100%,0 28%);
}
.bar .lbl{
  font-weight:700; font-size:10px; letter-spacing:0;
  color: rgb(var(--acc-rgb)); text-transform:uppercase; white-space:nowrap;
}
.bar .grow{ flex:1 1 auto; min-width:12px; }
.bar .seg{ width:16px; height:7px; flex:none; background: rgb(var(--acc-rgb)); }
.bar .seg.a{ opacity:.35; }
.bar .seg.b{ opacity:.85; }
.bar.sub{ background: rgba(var(--acc-rgb), 0.10); }
.bar.sub .ico{ width:15px; height:15px; }
.bar.sub .seg.a{ display:none; }
.bar.sub .seg.b{ width:18px; opacity:.50; }

/* ---------- en-tete collante ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background: rgba(11,14,18,0.94);
  backdrop-filter: blur(10px);
  border-bottom:1px solid var(--hair);
}
.topbar .row{ max-width:1560px; margin:0 auto; padding:14px 34px 0; }

.brand{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.brand .logo{ font-weight:900; font-size:26px; letter-spacing:.20em; color:var(--tx); text-transform:uppercase; }
.brand .logo em{ font-style:normal; color:var(--amber); }
.brand .sub{ font-weight:500; font-size:10px; letter-spacing:.22em; color:var(--tx-mute); text-transform:uppercase; }
.brand .spacer{ flex:1 1 auto; }
.brand .build{
  font-weight:700; font-size:10px; letter-spacing:.10em;
  color:var(--amber); background:rgba(var(--amber-rgb),0.12);
  border:1px solid rgba(var(--amber-rgb),0.30); padding:4px 10px;
}

/* ---------- selecteur de langue ---------- */
.langs{ display:flex; gap:0; border:1px solid var(--hair); }
.lang{
  font-family:inherit; font-weight:700; font-size:10px; letter-spacing:.14em;
  color:var(--tx-mute); background:rgba(24,30,38,0.95);
  border:none; border-right:1px solid var(--hair);
  padding:5px 11px; cursor:pointer; transition:all .14s ease;
}
.lang:last-child{ border-right:none; }
.lang:hover{ background:rgba(var(--amber-rgb),0.22); color:var(--tx); }
.lang.on{ background:rgba(var(--amber-rgb),0.38); color:#0B0E12; }

/* ---------- tuiles chiffrees = filtre ---------- */
.kpis{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.kpi{
  min-width:132px; flex:1 1 132px;
  background: rgba(34,43,52,0.95);
  border-left:2px solid rgb(var(--acc-rgb));
  padding:8px 12px 10px; cursor:pointer; transition: background .14s ease;
}
.kpi:hover{ background: rgba(var(--acc-rgb), 0.16); }
.kpi.on{ background: rgba(var(--acc-rgb), 0.20); }
.kpi .v{ font-weight:900; font-size:20px; color: rgb(var(--acc-rgb)); font-variant-numeric:tabular-nums; line-height:1.1; }
.kpi .k{ font-weight:400; font-size:9px; color:var(--tx-mute); letter-spacing:.12em; text-transform:uppercase; }
.kpi[data-f="all"]{ flex:0 0 auto; min-width:150px; }

/* ---------- navigation ---------- */
.nav{ display:flex; gap:6px; flex-wrap:wrap; padding:12px 34px 14px; max-width:1560px; margin:0 auto; }
.chip{
  font-family:inherit; font-weight:700; font-size:10px; letter-spacing:.10em; text-transform:uppercase;
  color:var(--tx-mute); background: rgba(24,30,38,0.95);
  border:1px solid var(--hair); padding:6px 12px; cursor:pointer; transition: all .14s ease;
}
.chip:hover{ background: rgba(var(--amber-rgb),0.22); color:var(--tx); border-color:rgba(var(--amber-rgb),0.45); }
.chip:active{ background: rgba(var(--amber-rgb),0.38); }
.chip.now{ color:var(--amber); border-color:rgba(var(--amber-rgb),0.45); }
.chip .dot{ display:inline-block; width:6px; height:6px; background:var(--amber); margin-right:6px; vertical-align:middle; }
.nav .sep{ width:1px; background:var(--hair); margin:2px 6px; }
.nav .hint{ margin-left:auto; font-size:9.5px; letter-spacing:.10em; color:#4A545F; text-transform:uppercase; align-self:center; }

/* ---------- corps ---------- */
main{ max-width:1560px; margin:0 auto; padding:26px 34px 90px; }

.quarter{ margin-bottom:22px; padding:0 0 18px; scroll-margin-top:150px; }

.q-meta{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:12px 16px 10px; border-bottom:1px solid var(--hair);
}
.q-meta .when{ font-weight:400; font-size:10.5px; color:var(--tx-mute); letter-spacing:.12em; text-transform:uppercase; }
.q-meta .tally{ font-weight:400; font-size:10.5px; color:var(--tx-mute); letter-spacing:.06em; }
.q-meta .tally b{ font-weight:700; color:var(--tx-body); }

.prog{ position:relative; flex:1 1 220px; min-width:180px; height:5px; background:#232E3B; }
.prog i{ position:absolute; inset:0 auto 0 0; background:rgb(var(--acc-rgb)); display:block; }
.prog::after{
  content:''; position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(8,11,15,.90),rgba(8,11,15,.90)),
    linear-gradient(rgba(8,11,15,.90),rgba(8,11,15,.90)),
    linear-gradient(rgba(8,11,15,.90),rgba(8,11,15,.90));
  background-size:1px 100%, 1px 100%, 1px 100%;
  background-position:25% 0, 50% 0, 75% 0;
  background-repeat:no-repeat;
}
.q-meta .pct{ font-weight:900; font-size:13px; color:rgb(var(--acc-rgb)); font-variant-numeric:tabular-nums; min-width:42px; text-align:right; }

.group{ padding:16px 16px 0; }
.group .bar{ margin-bottom:10px; }

.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:8px; }

.card{
  --acc-rgb: var(--slate-rgb);
  position:relative;
  background: rgba(24,30,38,0.92);
  border:1px solid var(--hair);
  border-left:2px solid rgba(var(--acc-rgb),0.75);
  padding:11px 14px 12px;
  transition: background .14s ease, border-color .14s ease, transform .14s ease;
}
.card:hover{
  background: rgba(34,43,52,0.96);
  border-color: rgba(var(--acc-rgb),0.40);
  border-left-color: rgb(var(--acc-rgb));
  transform:translateY(-1px);
}
.card[data-status="done"]  { --acc-rgb: var(--matter-rgb); }
.card[data-status="check"] { --acc-rgb: var(--notif-rgb); }
.card[data-status="wip"]   { --acc-rgb: var(--amber-rgb); }
.card[data-status="todo"]  { --acc-rgb: var(--slate-rgb); }
.card[data-status="bug"]   { --acc-rgb: var(--deny-rgb); }

.card-head{ display:flex; align-items:flex-start; gap:10px; margin-bottom:5px; }
.card-title{ flex:1; font-weight:700; font-size:11.5px; letter-spacing:.04em; color:var(--tx); text-transform:uppercase; line-height:1.35; }
.card[data-status="done"] .card-title{ color:#DDE7EF; }
.card[data-status="bug"]  .card-title{ color:#FFC9CB; }

.tag{
  flex:none; display:flex; align-items:center; gap:4px;
  font-weight:700; font-size:8.5px; letter-spacing:.10em; text-transform:uppercase;
  color: rgb(var(--acc-rgb)); background: rgba(var(--acc-rgb),0.12);
  padding:3px 6px; margin-top:1px; white-space:nowrap;
}
.tag i{ width:10px; height:6px; background:rgb(var(--acc-rgb)); opacity:.85; display:block; }

.card-desc{ font-size:11.5px; line-height:1.55; color:var(--tx-body); letter-spacing:.02em; }
.card-rest{
  margin-top:7px; padding:6px 0 0 9px;
  border-left:1px solid rgba(var(--steel-rgb),0.35);
  font-size:10.5px; line-height:1.5; color:var(--tx-mute); letter-spacing:.02em;
}
.card-rest b{ font-weight:700; color:rgb(var(--acc-rgb)); }

.card-meta{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
.vtag{
  font-weight:700; font-size:8.5px; letter-spacing:.08em;
  color:rgba(var(--steel-rgb),1); background:rgba(var(--steel-rgb),0.14);
  border:1px solid rgba(var(--steel-rgb),0.28); padding:2px 6px;
}
.when-s{ font-weight:400; font-size:9px; letter-spacing:.12em; color:#5E6B78; text-transform:uppercase; }

/* ---------- archive repliable ---------- */
.archive{ margin-top:34px; }
.arch-intro{ padding:10px 16px 14px; font-size:10.5px; color:var(--tx-mute); letter-spacing:.05em; }

details.q-old{ margin:0 0 6px; }
details.q-old > summary{
  list-style:none; cursor:pointer;
  display:flex; align-items:center; gap:10px; padding:9px 14px;
  background: rgba(24,30,38,0.92);
  border:1px solid var(--hair);
  border-left:2px solid rgba(var(--steel-rgb),0.75);
  transition: background .14s ease;
}
details.q-old > summary::-webkit-details-marker{ display:none; }
details.q-old > summary:hover{ background: rgba(var(--amber-rgb),0.14); }
details.q-old > summary .caret{
  width:0; height:0; flex:none;
  border-left:6px solid var(--amber); border-top:4px solid transparent; border-bottom:4px solid transparent;
  transition: transform .16s ease;
}
details.q-old[open] > summary .caret{ transform:rotate(90deg); }
details.q-old > summary .qn{ font-weight:900; font-size:12px; letter-spacing:.10em; color:var(--tx); text-transform:uppercase; }
details.q-old > summary .qw{ font-weight:400; font-size:10px; letter-spacing:.12em; color:var(--tx-mute); text-transform:uppercase; }
details.q-old > summary .qc{ margin-left:auto; font-weight:700; font-size:10px; letter-spacing:.08em; color:var(--matter); }
details.q-old .cards{ padding:8px 0 14px; }

.hidden{ display:none !important; }

footer{
  max-width:1560px; margin:0 auto; padding:26px 34px 60px;
  border-top:1px solid var(--hair);
  font-size:10px; letter-spacing:.12em; color:#4A545F; text-transform:uppercase;
  display:flex; gap:16px; flex-wrap:wrap; align-items:center;
}
footer .note{ text-transform:none; letter-spacing:.03em; color:#5E6B78; font-size:10.5px; }

@media (max-width: 720px){
  .topbar .row, .nav, main, footer{ padding-left:16px; padding-right:16px; }
  .brand .logo{ font-size:20px; }
  .cards{ grid-template-columns:1fr; }
}
</style>
</head>

      x:{ en:"An area module is designated by THROWING a physical beacon: hold the key to aim, a holographic arc and impact ring show the real landing point, left click launches, right click cancels. Crosshair states: reloading, out of range, no sky. No interface marker on the ground, ever.",
          fr:"Un module à effet de zone se désigne en LANÇANT une balise physique : maintien de la touche pour viser, arc holographique et anneau d'impact sur le vrai point de chute, clic gauche pour lancer, clic droit pour annuler. États de croix : recharge, hors portée, pas de ciel. Aucun marqueur d'interface au sol.",
          es:"Un módulo de área se designa LANZANDO una baliza física: mantén la tecla para apuntar, un arco holográfico y un anillo de impacto muestran el punto de caída real, clic izquierdo para lanzar, clic derecho para cancelar. Estados de mira: recargando, fuera de alcance, sin cielo. Nunca un marcador de interfaz en el suelo." },
      r:{ en:"<b>Note:</b> back-mounted ordnance is excluded by decision, those are weapons and they fire straight.",
          fr:"<b>Note :</b> les munitions dorsales sont exclues par décision, ce sont des armes, elles tirent tout droit.",
          es:"<b>Nota:</b> el armamento dorsal queda excluido por decisión, son armas y disparan en línea recta." } },

          es:"Módulo de antena de largo alcance: radio integrada manos libres y alcance de recepción duplicado, tanto en emisoras como en señales de misión." } },

          fr:"Premier drone compagnon : soin en zone par pulses, coût en matière, déploiement par la roue.",

    { s:"done", d:"25/08",
      t:{ en:"Fleet recall v2", fr:"Rappel de flotte v2", es:"Llamada de flota v2" },
      x:{ en:"Your OWNED vehicle now flies in from 3 km away instead of popping in 25 m behind you. Five replicated phases: summon, inbound, rendezvous, settle, released. What lands is the real vehicle, straight out of the garage pipeline, with ownership, persistence and duplicate protection untouched.",
          fr:"Le véhicule POSSÉDÉ arrive en volant depuis 3 km au lieu d'apparaître 25 m derrière le joueur. 5 phases répliquées (appel, approche, rendez-vous, pose, remise). Le véhicule livré est le vrai véhicule, sorti du pipeline garage : possession, persistance et anti-doublon inchangés.",
          es:"Tu vehículo EN PROPIEDAD llega volando desde 3 km en lugar de aparecer 25 m detrás de ti. Cinco fases replicadas: llamada, aproximación, encuentro, aterrizaje y entrega. Lo que llega es el vehículo real, salido del sistema de garaje, con la propiedad, la persistencia y la protección antiduplicado intactas." },
      r:{ en:"<b>Validated in game by RzZz on 25/08.</b>",
          fr:"<b>Validé en jeu par RzZz le 25/08.</b>",
          es:"<b>Validado en el juego por RzZz el 25/08.</b>" } },

    { s:"done", d:"31/07",
      t:{ en:"Transit transponder", fr:"Transpondeur de transit", es:"Transpondedor de tránsito" },
      x:{ en:"The planetary fast-travel network (200 stations, a real ship that comes to pick you up) moves out of the base menus and becomes a cyborg module, with its per-trip cost in Coins.",
          fr:"Le réseau de voyage rapide planétaire (200 stations, un vrai vaisseau qui vient chercher le joueur) sort des menus de base et devient un module cyborg, avec son coût en Coins par trajet.",
          es:"La red planetaria de viaje rápido (200 estaciones, una nave real que viene a recogerte) sale de los menús básicos y se convierte en un módulo ciborg, con su coste en Coins por trayecto." },
      r:{ en:"<b>Left:</b> 4 finishing Blueprint edits.",
          fr:"<b>Reste :</b> 4 éditions Blueprint de finition.",
          es:"<b>Queda:</b> 4 ediciones de Blueprint de acabado." } },

    { s:"done", d:"14/08",
      t:{ en:"Module loot", fr:"Loot de modules", es:"Botín de módulos" },
      x:{ en:"Modules are found out in the world: procedural placement across 5 location profiles (bunker, relay, ruins, warp, industrial), respawn on a long server cycle of 48 to 96 h, and drops from the death of certain police units (2% passive, 0.15% active). Live in the universe since 14/08.",
          fr:"Les modules se trouvent dans le monde : placement procédural sur 5 profils de lieu (bunker, relais, ruines, warp, industriel), respawn en cycle long serveur de 48 à 96 h, et drops sur la mort de certaines unités de police (2 % passifs, 0,15 % actifs). Actif en univers depuis le 14/08.",
          es:"Los módulos se encuentran por el mundo: colocación procedural en 5 perfiles de lugar (búnker, repetidor, ruinas, warp, industrial), reaparición en ciclo largo de servidor de 48 a 96 h, y caídas al morir ciertas unidades policiales (2 % pasivos, 0,15 % activos). Activo en el universo desde el 14/08." },
      r:{ en:"<b>Left:</b> a balancing pass with the 31 new items.",
          fr:"<b>Reste :</b> passe d'équilibrage avec les 31 nouveaux items.",
          es:"<b>Queda:</b> una pasada de equilibrado con los 31 objetos nuevos." } },

    { s:"done", d:"25/08",
      t:{ en:"Module items", fr:"Items de module", es:"Objetos de módulo" },
      x:{ en:"31 item pairs created on 25/08 (26 cyborg, transit transponder, 3 weapon, 1 vehicle). The registry goes from 17 to 48 modules carrying an item, and the module vending machine from 14 to 45 entries on sale.",
          fr:"31 paires d'items créées le 25/08 (26 cyborg, transpondeur de transit, 3 arme, 1 véhicule). Le registre passe de 17 à 48 modules porteurs d'item, et le distributeur de modules de 14 à 45 entrées en vente.",
          es:"31 pares de objetos creados el 25/08 (26 ciborg, transpondedor de tránsito, 3 de arma, 1 de vehículo). El registro pasa de 17 a 48 módulos con objeto, y la máquina expendedora de módulos de 14 a 45 entradas a la venta." },
      r:{ en:"<b>Left:</b> 57 modules out of 105 still have no inventory item.",
          fr:"<b>Reste :</b> 57 modules sur 105 n'ont toujours pas d'item d'inventaire.",
          es:"<b>Queda:</b> 57 módulos de 105 siguen sin objeto de inventario." } },

    { s:"done", d:"13/08",
      t:{ en:"Wall feedback", fr:"Retours du mur", es:"Respuestas del muro" },
      x:{ en:"The wall answers back: 8 configurable sounds (insert, remove, refuse, open, close), phase logos tinted by tier in the stock, localised help message. Sounds validated by ear by RzZz.",
          fr:"Le mur répond : 8 sons configurables (insertion, retrait, refus, ouverture, fermeture), logos de phase teintés par palier dans le stock, message d'aide localisé. Sons validés à l'oreille par RzZz.",
          es:"El muro responde: 8 sonidos configurables (insertar, retirar, rechazo, abrir, cerrar), logotipos de fase teñidos por nivel en el inventario, mensaje de ayuda traducido. Sonidos validados de oído por RzZz." } },

    { s:"done", d:"18/08",
      t:{ en:"Module audio contract", fr:"Contrat audio des modules", es:"Contrato de audio de módulos" },
      x:{ en:"A central audio library for every module: a single entry point instead of per-asset wiring, plus a resampling fix covering the 108 project sources above 48 kHz.",
          fr:"Bibliothèque audio centrale pour tous les modules : un seul point d'entrée au lieu d'un câblage par asset, plus la correction du rééchantillonnage sur les 108 sources du projet au-dessus de 48 kHz.",
          es:"Biblioteca de audio central para todos los módulos: un único punto de entrada en lugar de un cableado por recurso, más la corrección del remuestreo en las 108 fuentes del proyecto por encima de 48 kHz." } },

    { s:"done", d:"22/08",
      t:{ en:"Fix: empty Modules menu in multiplayer", fr:"Fix : menu Modules vide en multi", es:"Corrección: menú de Módulos vacío en multijugador" },
      x:{ en:"On a dedicated server the MODULES menu was completely empty even though module gameplay worked. On join, the player state, its replicated component and the controller link arrive on three independent channels, and the screen only tried to hook up once. Fixed with an arrival delegate plus a bounded retry.",
          fr:"Sur serveur dédié, le menu MODULES était totalement vide alors que le gameplay des modules fonctionnait. Au join, le PlayerState, son composant répliqué et le lien du contrôleur arrivent sur 3 canaux indépendants, et l'écran ne tentait son accrochage qu'une seule fois. Corrigé par un délégué d'arrivée plus une nouvelle tentative bornée.",
          es:"En servidor dedicado el menú MÓDULOS aparecía completamente vacío aunque la jugabilidad de los módulos funcionaba. Al entrar, el estado del jugador, su componente replicado y el enlace del controlador llegan por tres canales independientes, y la pantalla solo intentaba engancharse una vez. Corregido con un delegado de llegada más un reintento acotado." },
      r:{ en:"<b>Left:</b> the Steam client rebuild for production.",
          fr:"<b>Reste :</b> rebuild du client Steam pour la production.",
          es:"<b>Queda:</b> la recompilación del cliente de Steam para producción." } }
  ]},

  { a:"steel", n:{ en:"Quests & narrative", fr:"Quêtes & narration", es:"Misiones y narrativa" }, items:[

    { s:"wip", d:"22/08",
      t:{ en:"Quest sounds", fr:"Sons de quête", es:"Sonidos de misión" },
      x:{ en:"The quest completion sound NEVER came out on a dedicated server: it was played server-side, on a machine with no audio device. Fixed by sending it to the client, with default sounds in the settings. 26 quests out of 27 were silent.",
          fr:"Le son de fin de quête ne sortait JAMAIS en serveur dédié : il était joué côté serveur, sur une machine sans périphérique audio. Corrigé par un envoi vers le client, avec des sons par défaut dans les réglages. 26 quêtes sur 27 étaient muettes.",
          es:"El sonido de fin de misión NUNCA sonaba en servidor dedicado: se reproducía en el servidor, en una máquina sin dispositivo de audio. Corregido enviándolo al cliente, con sonidos por defecto en los ajustes. 26 de las 27 misiones estaban mudas." },
      r:{ en:"<b>Left:</b> the fix is written but not yet compiled, nor validated in game.",
          fr:"<b>Reste :</b> le correctif est écrit mais pas encore compilé, ni validé en jeu.",
          es:"<b>Queda:</b> la corrección está escrita pero aún no compilada ni validada en el juego." } },

    { s:"check", d:"17/07",
      t:{ en:"Mission radio beacons", fr:"Balises radio de mission", es:"Balizas de radio de misión" },
      x:{ en:"Short-lived radio beacons for quests: the Ghost Signal quest makes you hunt a signal by ear, with a station registry created on the fly and a dedicated native quest action.",
          fr:"Balises radio éphémères pour les quêtes : la quête Ghost Signal fait chasser un signal à l'oreille, avec un registre de stations créé à la volée et une action de quête native dédiée.",
          es:"Balizas de radio efímeras para misiones: la misión Ghost Signal te hace cazar una señal de oído, con un registro de emisoras creado sobre la marcha y una acción de misión nativa dedicada." },
      r:{ en:"<b>Left:</b> a drive test in game (audio gradient, module ground height).",
          fr:"<b>Reste :</b> conduite en jeu (gradient audio, hauteur au sol du module).",

    { s:"done", d:"16/07",
      t:{ en:"Quest tooling", fr:"Outillage de quêtes", es:"Herramientas de misiones" },

          es:"17 herramientas de creación de misiones entregadas: creación, objetivos con cadena de requisitos, acciones, condiciones, zonas de activación, validación y exportación. Verificadas de principio a fin en una misión de prueba." },

    { s:"done", d:"21/08",

      x:{ en:"The tutorial now installs the 4 base cyborg modules on the wall at tier 1, with an optional module choice step and an “open your wall” beat. Version corrected by RzZz, tested in game.",
          fr:"Le tutoriel installe désormais les 4 modules cyborg de base sur le mur au palier 1, avec une étape optionnelle de choix de module et un temps fort « ouvre ton mur ». Version corrigée par RzZz, testée en jeu.",
          es:"El tutorial ahora instala los 4 módulos ciborg básicos en el muro en el nivel 1, con un paso opcional de elección de módulo y un momento clave de « abre tu muro ». Versión corregida por RzZz, probada en el juego." } },

    { s:"done", d:"22/08",
      t:{ en:"Quest authoring method", fr:"Méthode de quête", es:"Método de creación de misiones" },

          es:"El método de creación de misiones queda consolidado tras la revisión del tutorial por RzZz: 7 desviaciones corregidas (acciones nativas, valores de acción en la exportación de ejecución, claves de traducción, recuento de recogidas)." } }
  ]},

  { a:"slate", n:{ en:"Technical & production", fr:"Technique & production", es:"Técnica y producción" }, items:[

    { s:"bug", d:"25/08",
      t:{ en:"HOTAS axis rebinding", fr:"Rebind des axes HOTAS", es:"Reasignación de ejes HOTAS" },
      x:{ en:"Player report from 25/08, the most blocking one: HOTAS axes are lost at every update and can no longer be reassigned, moving the stick during binding does nothing. The saved key name depends on the device enumeration order: if that shifts, the axis goes silent with no message at all.",
          fr:"Retour joueur du 25/08, le plus bloquant : les axes HOTAS sont perdus à chaque mise à jour et ne peuvent plus être réassignés, bouger le manche pendant l'assignation ne fait rien. Le nom de touche sauvegardé dépend de l'ordre d'énumération des périphériques : s'il bouge, l'axe devient muet sans aucun message.",
          es:"Informe de jugador del 25/08, el más bloqueante: los ejes del HOTAS se pierden en cada actualización y ya no se pueden reasignar, mover la palanca durante la asignación no hace nada. El nombre de tecla guardado depende del orden de enumeración de los dispositivos: si cambia, el eje se queda mudo sin ningún mensaje." },
      r:{ en:"<b>To do:</b> stable naming for device axes, and repair the rebinding screen.",
          fr:"<b>À faire :</b> nommage stable des axes de périphérique, et réparation de l'écran de réassignation.",
          es:"<b>Por hacer:</b> nombres estables para los ejes de dispositivo, y reparar la pantalla de reasignación." } },

    { s:"wip", d:"26/08",
      t:{ en:"Blueprint to C++ migration", fr:"Migration Blueprint vers C++", es:"Migración de Blueprint a C++" },
      x:{ en:"Blueprint paths that run at a fixed rate, or multiplied by the number of actors, are moving to native code. First worksite done: shared target registry, vehicle combat and missile lock. The global scan is gone, and 7 native tests pass in solo, listen server and dedicated server.",
          fr:"Les chemins Blueprint exécutés à fréquence fixe ou multipliés par le nombre d'acteurs passent en natif. Premier chantier terminé : registre de cibles partagé, combat véhicule et verrou de missile. Le scan global est supprimé, 7 tests natifs verts en solo, serveur d'écoute et serveur dédié.",
          es:"Las rutas de Blueprint que se ejecutan a frecuencia fija, o multiplicadas por el número de actores, pasan a código nativo. Primer bloque terminado: registro de objetivos compartido, combate de vehículo y fijado de misiles. El escaneo global ha desaparecido y 7 pruebas nativas pasan en solitario, servidor de escucha y servidor dedicado." },
      r:{ en:"<b>Next:</b> player interaction (423 nodes, a trace every frame), character and gravity, camera, then weapons, inventory and combat.",
          fr:"<b>Suite :</b> interaction joueur (423 noeuds, trace à chaque frame), personnage et gravité, caméra, puis armes, inventaire et combat.",
          es:"<b>A continuación:</b> interacción del jugador (423 nodos, un trazado por fotograma), personaje y gravedad, cámara, y después armas, inventario y combate." } },

    { s:"done", d:"22/08",
      t:{ en:"Localisation repaired", fr:"Localisation réparée", es:"Localización reparada" },
      x:{ en:"Translating was not enough, translations were never recompiled: two weeks of work never reached the game. The gather and compile chain is running again across 11 cultures, and the pass dropped from a projected 11 h to a few minutes.",
          fr:"Traduire ne suffisait pas, les traductions n'étaient jamais recompilées : deux semaines de travail n'arrivaient pas en jeu. Chaîne de collecte et de compilation remise en marche sur 11 cultures, la passe tombe de 11 h projetées à quelques minutes.",
          es:"Traducir no bastaba, las traducciones nunca se recompilaban: dos semanas de trabajo no llegaban al juego. La cadena de recopilación y compilación vuelve a funcionar en 11 idiomas, y la pasada baja de las 11 h previstas a unos minutos." } },

    { s:"done", d:"29/07",
      t:{ en:"Test harness", fr:"Harnais de tests", es:"Banco de pruebas" },
      x:{ en:"An automated test suite for the project: regressions are measured without opening the editor, in about a minute.",
          fr:"Suite de tests automatisés du projet : les régressions se mesurent sans ouvrir l'éditeur, en une minute.",
          es:"Conjunto de pruebas automatizadas del proyecto: las regresiones se miden sin abrir el editor, en un minuto." } },

    { s:"done", d:"12/08",
      t:{ en:"Reflective calls hardened", fr:"Durcissement des appels réflexifs", es:"Endurecimiento de las llamadas reflexivas" },
      x:{ en:"A pass over the C++ to Blueprint calls made through reflection: strict contracts, safe parameter construction, and a return to native APIs wherever they exist.",
          fr:"Passe sur les appels C++ vers Blueprint faits par réflexion : contrats stricts, construction de paramètres sécurisée, retour aux API natives quand elles existent.",
          es:"Revisión de las llamadas de C++ a Blueprint hechas por reflexión: contratos estrictos, construcción segura de parámetros y vuelta a las API nativas cuando existen." } },

    { s:"done", d:"24/07",
      t:{ en:"Build warnings audit", fr:"Audit des warnings de build", es:"Auditoría de avisos de compilación" },
      x:{ en:"A full audit of the project's compilation warnings.",
          fr:"Audit complet des avertissements de compilation du projet.",
          es:"Auditoría completa de los avisos de compilación del proyecto." } }
  ]}

/* =========================================================================
   MOTEUR D'AFFICHAGE
   La page est reconstruite depuis DATA / ARCHIVE a chaque changement de
   langue. Aucun chiffre n'est ecrit en dur : compteurs, totaux et
   pourcentages sont recalcules a partir du DOM.
   ========================================================================= */
(function(){

  var ACC = {
    amber:  "var(--amber-rgb)",
    steel:  "var(--steel-rgb)",
    matter: "var(--matter-rgb)",
    notif:  "var(--notif-rgb)",
    slate:  "var(--slate-rgb)"
  };

  var STATUSES = ["done","check","wip","todo","bug"];
  var LKEY = "qanga-roadmap-lang";
  var LANG = "en";
  var FILTER = "all";

  try { var saved = localStorage.getItem(LKEY); if (saved && UI[saved]) LANG = saved; } catch(e) {}

  /* ---------------- fabrique d'elements ---------------- */
  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined && txt !== null) e.textContent = txt;
    return e;
  }

  function bar(accKey, label, isSub){
    var b = el("div", isSub ? "bar sub" : "bar");
    b.style.setProperty("--acc-rgb", ACC[accKey] || ACC.amber);
    b.appendChild(el("span","ico"));
    b.appendChild(el("span","lbl", label));
    b.appendChild(el("span","grow"));
    b.appendChild(el("span","seg a"));
    b.appendChild(el("span","seg b"));
    return b;
  }

  function card(it){
    var c = el("article","card");
    c.setAttribute("data-status", it.s);

    var h = el("div","card-head");
    h.appendChild(el("h3","card-title", it.t[LANG]));
    var tg = el("span","tag");
    tg.appendChild(el("i"));
    tg.appendChild(document.createTextNode(UI[LANG].tag[it.s]));
    h.appendChild(tg);
    c.appendChild(h);

    c.appendChild(el("p","card-desc", it.x[LANG]));

    if (it.r){
      var r = el("p","card-rest");
      r.innerHTML = it.r[LANG];
      c.appendChild(r);
    }

    if ((it.v && it.v.length) || it.d){
      var m = el("div","card-meta");
      (it.v || []).forEach(function(v){ m.appendChild(el("span","vtag", v)); });
      if (it.d) m.appendChild(el("span","when-s", it.d));
      c.appendChild(m);
    }
    return c;
  }

  function quarterNode(q){
    var s = el("section","quarter frame");
    s.id = q.id;
    s.style.setProperty("--acc-rgb", ACC[q.a] || ACC.slate);

    var state = (q.state === "cur") ? UI[LANG].cur : UI[LANG].plan;
    s.appendChild(bar(q.a, q.qn + "  /  " + state, false));

    var m = el("div","q-meta");
    m.appendChild(el("span","when", q.when[LANG]));
    var p = el("span","prog"); p.appendChild(el("i"));
    m.appendChild(p);
    m.appendChild(el("span","pct","0%"));
    m.appendChild(el("span","tally"));
    s.appendChild(m);

    q.groups.forEach(function(g){
      var gg = el("div","group");
      if (g.n) gg.appendChild(bar(g.a, g.n[LANG], true));
      var cs = el("div","cards");
      g.items.forEach(function(it){ cs.appendChild(card(it)); });
      gg.appendChild(cs);
      s.appendChild(gg);
    });
    return s;
  }

  function archiveNode(openIds){
    var s = el("section","archive frame");
    s.id = "archive";
    s.appendChild(bar("steel", UI[LANG].archive, false));
    s.appendChild(el("p","arch-intro", UI[LANG].archIntro));

    var g = el("div","group");
    g.style.paddingTop = "0";

    ARCHIVE.forEach(function(q){
      var d = document.createElement("details");
      d.className = "q-old";
      d.id = q.id;
      if (openIds && openIds.indexOf(q.id) !== -1) d.open = true;

      var sm = document.createElement("summary");
      sm.appendChild(el("span","caret"));
      sm.appendChild(el("span","qn", q.qn));
      sm.appendChild(el("span","qw", q.when[LANG]));
      sm.appendChild(el("span","qc"));
      d.appendChild(sm);

      var cs = el("div","cards");
      q.items.forEach(function(it){ cs.appendChild(card(it)); });
      d.appendChild(cs);
      g.appendChild(d);
    });

    s.appendChild(g);
    return s;
  }

  function navNode(){
    var n = document.getElementById("nav");
    n.innerHTML = "";

    DATA.forEach(function(q){
      var b = el("button", q.state === "cur" ? "chip now" : "chip");
      b.setAttribute("data-go", q.id);
      if (q.state === "cur") b.appendChild(el("span","dot"));
      b.appendChild(document.createTextNode(q.qn));
      n.appendChild(b);
    });

    n.appendChild(el("span","sep"));

    var ab = el("button","chip", UI[LANG].navArchive);
    ab.setAttribute("data-go","archive");
    n.appendChild(ab);

    var eb = el("button","chip", UI[LANG].expand);
    eb.id = "expand-all";
    n.appendChild(eb);

    n.appendChild(el("span","hint", UI[LANG].hint));
  }

  /* ---------------- compteurs ---------------- */
  function tallyOf(root){
    var t = { done:0, check:0, wip:0, todo:0, bug:0, all:0 };
    root.querySelectorAll(".card").forEach(function(c){
      var s = c.getAttribute("data-status");
      if (t[s] === undefined) s = "todo";
      t[s]++; t.all++;
    });
    return t;
  }

  function say(n, k){
    var pair = UI[LANG].lab[k];
    return n + " " + pair[n > 1 ? 1 : 0];
  }

  function paint(){
    var g = tallyOf(document);
    document.querySelectorAll("[data-c]").forEach(function(e){
      e.textContent = g[e.getAttribute("data-c")] || 0;
    });

    document.querySelectorAll("section.quarter").forEach(function(q){
      var t = tallyOf(q);
      var parts = [];
      STATUSES.forEach(function(k){ if (t[k]) parts.push(say(t[k], k)); });

      var tally = q.querySelector(".tally");
      if (tally){
        var word = UI[LANG].task[t.all > 1 ? 1 : 0];
        tally.innerHTML = "<b>" + t.all + "</b> " + word +
          " &nbsp;&middot;&nbsp; " + parts.join(" &nbsp;&middot;&nbsp; ");
      }

      var pctVal = t.all ? Math.round((t.done / t.all) * 100) : 0;
      var fill = q.querySelector(".prog i");
      if (fill) fill.style.width = pctVal + "%";
      var pct = q.querySelector(".pct");
      if (pct) pct.textContent = pctVal + "%";
    });

    document.querySelectorAll("details.q-old").forEach(function(d){
      var t = tallyOf(d);
      var qc = d.querySelector(".qc");
      if (qc) qc.textContent = t.all + " " + UI[LANG].task[t.all > 1 ? 1 : 0];
    });
  }

  /* ---------------- filtre par etat ---------------- */
  function applyFilter(){
    var f = FILTER;

    document.querySelectorAll(".kpi").forEach(function(k){
      k.classList.toggle("on", k.getAttribute("data-f") === f);
    });

    document.querySelectorAll(".card").forEach(function(c){
      var s = c.getAttribute("data-status");
      c.classList.toggle("hidden", f !== "all" && s !== f);
    });

    document.querySelectorAll(".group").forEach(function(gr){
      if (gr.querySelector("details")) return;
      gr.classList.toggle("hidden", gr.querySelectorAll(".card:not(.hidden)").length === 0);
    });

    document.querySelectorAll("section.quarter").forEach(function(q){
      q.classList.toggle("hidden", q.querySelectorAll(".card:not(.hidden)").length === 0);
    });

    document.querySelectorAll("details.q-old").forEach(function(d){
      var visible = d.querySelectorAll(".card:not(.hidden)").length;
      d.classList.toggle("hidden", visible === 0);
      if (f !== "all") d.open = visible > 0;
    });

    var arch = document.getElementById("archive");
    if (arch) arch.classList.toggle("hidden",
      arch.querySelectorAll(".card:not(.hidden)").length === 0);
  }

  /* ---------------- interactions ---------------- */
  function bindNav(){
    document.querySelectorAll(".chip[data-go]").forEach(function(b){
      b.addEventListener("click", function(){
        var t = document.getElementById(b.getAttribute("data-go"));
        if (t) t.scrollIntoView({ behavior:"smooth", block:"start" });
      });
    });

    var exp = document.getElementById("expand-all");
    if (exp){
      exp.addEventListener("click", function(){
        var list = document.querySelectorAll("details.q-old");
        var anyClosed = Array.prototype.some.call(list, function(d){ return !d.open; });
        list.forEach(function(d){ d.open = anyClosed; });
        exp.textContent = anyClosed ? UI[LANG].collapse : UI[LANG].expand;
      });
    }
  }

  function bindKpis(){
    document.querySelectorAll(".kpi").forEach(function(k){
      k.addEventListener("click", function(){
        FILTER = k.getAttribute("data-f");
        applyFilter();
      });
    });
  }

  function spy(){
    var chips = document.querySelectorAll(".chip[data-go]");
    var best = null, bestTop = Infinity;
    chips.forEach(function(c){
      var t = document.getElementById(c.getAttribute("data-go"));
      if (!t) return;
      var top = t.getBoundingClientRect().top - 200;
      if (top <= 0 && Math.abs(top) < bestTop){ bestTop = Math.abs(top); best = c; }
    });
    chips.forEach(function(c){ c.classList.remove("now"); });
    if (best) best.classList.add("now");
  }

  /* ---------------- rendu complet ---------------- */
  function render(){
    var openIds = [];
    document.querySelectorAll("details.q-old[open]").forEach(function(d){ openIds.push(d.id); });
    var y = window.scrollY;

    var app = document.getElementById("app");
    app.innerHTML = "";
    DATA.forEach(function(q){ app.appendChild(quarterNode(q)); });
    app.appendChild(archiveNode(openIds));

    navNode();

    document.getElementById("ui-sub").textContent  = UI[LANG].sub;
    document.getElementById("ui-ea").textContent   = UI[LANG].ea;
    document.getElementById("ui-upd").textContent  = UI[LANG].upd;
    document.getElementById("ui-note").textContent = UI[LANG].note;

    document.querySelectorAll("[data-k]").forEach(function(e){
      e.textContent = UI[LANG].kpi[e.getAttribute("data-k")];
    });

    paint();
    applyFilter();
    bindNav();
    window.scrollTo(0, y);
    spy();
  }

  function setLang(l){
    if (!UI[l]) return;
    LANG = l;
    try { localStorage.setItem(LKEY, l); } catch(e) {}
    document.documentElement.lang = l;
    document.querySelectorAll(".lang").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-l") === l);
    });
    render();
  }

  document.querySelectorAll(".lang").forEach(function(b){
    b.addEventListener("click", function(){ setLang(b.getAttribute("data-l")); });
  });

  bindKpis();
  window.addEventListener("scroll", spy, { passive:true });

  setLang(LANG);
})();
</script>
